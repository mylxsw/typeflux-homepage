# Example locations to add to the existing HTTPS website server.
# root /srv/typeflux-homepage/dist;
# upstream typeflux_api must point at the Go API. TLS and trusted proxy policy
# remain the operator's responsibility; do not deploy an HTTP auth origin.

# Prefix wins over static regex/fallback. Includes Apple POST and OAuth resume.
location ^~ /api/v1/auth/web/ {
    proxy_pass http://typeflux_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Origin, Cookie, Content-Type and X-CSRF-Token are forwarded unchanged.
    # Never rewrite Origin to make the backend's security check succeed.
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
    # nginx error messages may include request URLs; disable collection for
    # these locations as well, and configure the CDN/APM the same way.
    error_log /dev/null crit;
}

# Precise legacy email-discovery endpoint; not a wildcard legacy-auth proxy.
location = /api/v1/auth/enter-email {
    proxy_pass http://typeflux_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
    error_log /dev/null crit;
}

location ~* ^/(?:zh-CN/|zh-TW/|ja/|ko/)?login(?:/complete)?/?$ {
    include /etc/nginx/snippets/web-auth-headers.conf;
    access_log off;
    error_log /dev/null crit;
    # A dedicated empty shell, not the prerendered marketing homepage.
    try_files /auth.html =404;
}

location = /auth.html {
    internal;
    include /etc/nginx/snippets/web-auth-headers.conf;
    access_log off;
    error_log /dev/null crit;
}

# Keep all existing public/prerendered routing and headers as-is. A website
# SPA fallback must NEVER catch /api/*; unknown API requests should stay JSON.
